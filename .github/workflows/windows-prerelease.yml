name: Windows prerelease
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run desktop:win
      - name: Test desktop boundaries and Figma imports
        run: node --test tests/desktop.test.mjs tests/desktop-signing.test.mjs tests/desktop-preferences.test.mjs tests/figma-import.test.mjs
      - name: Check packaged app starts on Windows
        shell: pwsh
        run: |
          $app = Start-Process -FilePath 'releases/desktop/win-unpacked/PixlPrfct.exe' -PassThru
          try {
            Start-Sleep -Seconds 15
            $app.Refresh()
            if ($app.HasExited) { throw "PixlPrfct exited during startup: $($app.ExitCode)" }
            if ($app.MainWindowHandle -eq 0) { throw 'PixlPrfct did not create a main window' }
            Write-Output "PixlPrfct opened a window on Windows; PID $($app.Id). This is a startup check, not a full interactive test."
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Record checksums and source
        shell: pwsh
        run: |
          $files = Get-ChildItem releases/desktop/* -File | Where-Object { $_.Extension -in '.exe', '.zip' } | Sort-Object Name
          if ($files.Count -ne 2) { throw 'Expected one installer and one ZIP' }
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content -Encoding utf8NoBOM releases/desktop/SHA256SUMS.txt
          @{
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            build = '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            platform = 'windows-x64'
            signing = 'unsigned'
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM releases/desktop/BUILD-PROVENANCE.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: PixlPrfct-windows-prerelease
          path: |
            releases/desktop/*.exe
            releases/desktop/*.zip
            releases/desktop/SHA256SUMS.txt
            releases/desktop/BUILD-PROVENANCE.json
          if-no-files-found: error
          retention-days: 14
