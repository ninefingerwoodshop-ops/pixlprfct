name: Check browser editor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - run: cargo fmt --check
      - run: npm run build
      - run: npm test
      - run: node --check web/app.js
